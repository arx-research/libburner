# Use node-modules so consumers (e.g. burner-app via `link:`) can resolve
# libburner's transitive deps from a normal node_modules tree without
# needing Yarn PnP active in the consumer.
nodeLinker: node-modules

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistries:
  "https://registry.npmjs.org":
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"

npmRegistryServer: "https://registry.npmjs.org"
