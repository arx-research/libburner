# Use node-modules so consumers (e.g. burner-app via `link:`) can resolve
# libburner's transitive deps from a normal node_modules tree without
# needing Yarn PnP active in the consumer.
nodeLinker: node-modules

# Never run dependencies' install scripts. The release job installs with
# id-token: write, so a compromised dependency's postinstall could otherwise
# publish libburner through our own trusted-publishing pipeline. The packages
# that list build scripts here (bigint-buffer, bufferutil, keccak,
# utf-8-validate) all fall back to plain JS.
enableScripts: false

# Refuse npm versions published less than 3 days ago; most malicious releases
# are pulled within that window. Applies when a version is resolved (yarn add,
# yarn up); versions already in yarn.lock are unaffected. Same as burner-app.
npmMinimalAgeGate: 3d

# Our own packages ship from GitHub Actions with npm provenance, and a libhalo
# fix sometimes has to land the same day.
npmPreapprovedPackages:
  - "@arx-research/*"

npmPublishRegistry: "https://registry.npmjs.org"

npmRegistries:
  "https://registry.npmjs.org":
    npmAuthToken: "${NODE_AUTH_TOKEN:-}"

npmRegistryServer: "https://registry.npmjs.org"
